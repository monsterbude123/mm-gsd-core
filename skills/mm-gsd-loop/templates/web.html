<!doctype html>
<!-- mm-gsd 过程看板 —— 固定布局,数据来自 /api/state(实时读 .planning);对 .planning 只读,
     唯一写通道是批注 POST /api/annotations。人类面为主(REQ-13):流程与上层规划,代码细节按钮展开。 -->
<html lang="zh">
<head>
<meta charset="utf-8">
<title>mm-gsd 过程看板</title>
<style>
  :root { --line: #d0d4dc; --mut: #6b7280; --red: #c2372f; --grn: #1a7f37; --amb: #9a6700; }
  body { font: 14px/1.55 system-ui, "Segoe UI", sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; }
  header { background: #1f2328; color: #fff; padding: 10px 20px; display: flex; gap: 16px; align-items: baseline; }
  header b { font-size: 15px; } header .mut { color: #9ea7b3; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 15px; margin: 22px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; margin: 8px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .st { font-size: 12px; color: var(--mut); }
  .pill { display: inline-block; border-radius: 10px; padding: 0 8px; font-size: 12px; margin-left: 6px; }
  .pill.ship { background: #dafbe1; color: var(--grn); } .pill.warn { background: #fff8c5; color: var(--amb); }
  .pill.rep { background: #ffebe9; color: var(--red); }
  table { width: 100%; border-collapse: collapse; background: #fff; }
  td, th { border: 1px solid var(--line); padding: 5px 8px; text-align: left; font-size: 13px; }
  .miss { color: var(--red); font-weight: 600; }
  .base { color: var(--mut); font-size: 12px; }
  button { border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 2px 10px; cursor: pointer; font-size: 12px; }
  button:hover { background: #eef1f4; }
  details { margin: 6px 0; } summary { cursor: pointer; }
  textarea { width: 100%; min-height: 56px; font: inherit; box-sizing: border-box; }
  select, input { padding: 3px 6px; font: inherit; }
  .ann { border-left: 3px solid var(--line); margin: 6px 0; padding: 4px 10px; background: #fff; }
  .ann.open { border-left-color: var(--amb); } .ann.digested { border-left-color: var(--grn); opacity: .75; }
  .mutd { color: var(--mut); font-size: 12px; }
</style>
</head>
<body>
<header><b>mm-gsd 过程看板</b><span id="declared" class="mut"></span><span id="gen" class="mut"></span></header>
<main>
  <h2>需求(REQ 溯源链:原话 → 认领票)</h2>
  <table id="reqs"><tr><th>REQ</th><th>原话一句话</th><th>认领票</th></tr></table>

  <h2>Phases</h2>
  <div id="phases" class="grid"></div>

  <h2>批注(用户审核 → agent 消化)</h2>
  <div class="card">
    <div style="display:flex;gap:8px;align-items:flex-start;">
      <select id="a-target"><option value="">目标…</option></select>
      <select id="a-type"><option>备注</option><option>需求遗漏</option><option>方向不对</option><option>验收不过</option></select>
    </div>
    <textarea id="a-text" placeholder="批注内容…(验收不过 → 触发点修分流)"></textarea>
    <div style="margin-top:6px;"><button id="a-post">提交批注</button> <span id="a-msg" class="mutd"></span></div>
  </div>
  <div id="anns"></div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function post(target, type, text) {
  const r = await fetch("/api/annotations", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ target, type, text }) });
  return r.json();
}
async function load() {
  const st = await (await fetch("/api/state")).json();
  document.getElementById("declared").textContent = "声明 " + (st.declared ?? "—") + " · phase " + (st.activePhase ?? "—");
  document.getElementById("gen").textContent = "生成于 " + st.generated.slice(0, 19).replace("T", " ");
  const tr = document.getElementById("reqs");
  tr.innerHTML = '<tr><th>REQ</th><th>原话一句话</th><th>认领票</th></tr>';
  for (const r of st.reqs) {
    const row = tr.insertRow();
    row.insertCell().textContent = r.id + (r.baseline ? " " : "");
    if (r.baseline) row.cells[0].innerHTML += ' <span class="base">baseline</span>';
    row.insertCell().textContent = r.text;
    const c = row.insertCell();
    if (r.claimed.length) c.textContent = r.claimed.join(", ");
    else if (!r.baseline) { c.innerHTML = '<span class="miss">无人认领</span>'; row.style.background = "#fff5f5"; }
    else c.innerHTML = '<span class="base">baseline 已交付</span>';
    row.insertCell().innerHTML = '<button data-rq="' + r.id + '" data-t="REQ:' + r.id + '">批注</button>';
  }
  const ph = document.getElementById("phases");
  ph.innerHTML = "";
  for (const p of st.phases) {
    const plans = p.plans.map((x) => x.plan + (x.summary ? (x.summary.status === "complete" ? " ✓" : " ⚠") : "")).join("<br>");
    const check = p.plans.map((x) => x.check ? x.check.file + ":" + x.check.status : "").filter(Boolean).join("<br>");
    const div = document.createElement("div");
    div.className = "card";
    const shipPill = p.ship ? '<span class="pill ' + (p.ship.status === "shipped" ? "ship" : "warn") + '">' + esc(p.ship.status) + "</span>" : "";
    div.innerHTML = '<b>phase ' + esc(p.phase) + "</b>" + shipPill +
      '<div class="st">' + esc(p.title || "") + "</div>" +
      '<div class="st">PLAN: <br>' + plans + "</div>" +
      (check ? '<div class="st">预审: ' + check + "</div>" : "") +
      (p.verification ? '<div class="st">VERIFICATION: ' + esc(p.verification.status) + "</div>" : "") +
      '<details><summary>用户原话 / CONTEXT</summary><div id="ctx-' + esc(p.phase) + '" class="st">加载中…</div>' +
      '<button data-rq="" data-t="phase:' + esc(p.phase) + '">批注此 phase</button></details>';
    ph.appendChild(div);
  }
  // 用户原话:懒加载 phase 详情时再取(此处一并内联,页面小,直接全量渲染)
  for (const p of st.phases) {
    const el = document.getElementById("ctx-" + p.phase);
    if (el && st.contexts && st.contexts[p.phase]) el.innerHTML = "<pre style='white-space:pre-wrap'>" + esc(st.contexts[p.phase].slice(0, 2000)) + "</pre>";
    else if (el) el.textContent = "(无 CONTEXT 或未在状态内)";
  }
  const sel = document.getElementById("a-target");
  sel.innerHTML = '<option value="">目标…</option>' + st.reqs.map((r) => '<option value="REQ:' + r.id + '">REQ:' + r.id + "</option>").join("") +
    st.phases.map((p) => '<option value="phase:' + p.phase + '">phase:' + p.phase + "</option>").join("");
  const an = document.getElementById("anns");
  an.innerHTML = st.annotations.length ? "" : '<div class="mutd">还没有批注。</div>';
  for (const a of st.annotations.slice().reverse()) {
    const div = document.createElement("div");
    div.className = "ann " + a.status;
    div.innerHTML = '<b>' + esc(a.type) + '</b> → ' + esc(a.target) + ' <span class="mutd">' + esc(a.ts.slice(0, 19).replace("T", " ")) + " · " + a.status + '</span><div>' + esc(a.text) + "</div>";
    an.appendChild(div);
  }
  document.getElementById("a-post").onclick = async () => {
    const r = await post(document.getElementById("a-target").value, document.getElementById("a-type").value, document.getElementById("a-text").value);
    document.getElementById("a-msg").textContent = r.ok ? "已落盘(id " + r.id + ")—— 在 agent 会话里说「有新批注」即可触发消化。" : "拒绝:" + (r.problems || []).join("; ");
    if (r.ok) load();
  };
  window.__st = st;
}
load();
</script>
</body>
</html>
